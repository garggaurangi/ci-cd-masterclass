name: Spring Boot build and deploy

on:
    push:
      branches:
        - main

env:
  IMAGE_NAME: spring-boot-app

jobs :
  built-deploy:
    runs-on : ubuntu-latest

    steps:
      - name : Checkout Source
        uses: actions/checkout@v7

      - name: Setting Up Java
        uses: actions/setup-java@v6
        with:
            distribution: temurin
            java-version: '21'
            cache: maven

      - name: Build jar
        run : mvn clean package -DskipTests

      - name: Building Docker Image
        run: docker build -t ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest .

      - name : Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{secrets.DOCKER_USERNAME}}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Push Image
        run: docker push ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest

      - name : Deploy to EC2 and execute remote SSH commands using password
        uses: appleboy/ssh-action@v1
        with:
            host: ${{ secrets.EC2_HOST}}
            username: ${{ secrets.EC2_USER }}
            key: ${{ secrets.EC2_SSH_KEY }}
            script: |
              docker pull ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest
              docker stop spring-boot-app || true
              docker rm spring-boot-app || true
              docker run -d --name spring-boot-app --restart unless-stopped -p 8080:8080 ${{secrets.DOCKER_USERNAME}}/${{env.IMAGE_NAME}}:latest
              docker image prune -f



